# Chak Server Configuration Example
# 
# This file shows how to configure the chak server.
# Copy this file and modify it for your own use.

providers:
  # Simple provider (uses default base_url)
  openai:
    api_key: ${OPENAI_API_KEY}

  # Provider with custom base_url
  ollama:
    api_key: "ollama"
    base_url: "http://localhost:11434/v1"

  # More providers (uncomment and add your keys):
  # anthropic:
  #   api_key: ${ANTHROPIC_API_KEY}
  # deepseek:
  #   api_key: ${DEEPSEEK_API_KEY}
  # bailian:
  #   api_key: ${BAILIAN_API_KEY}
  # google:
  #   api_key: ${GOOGLE_API_KEY}
  # zhipu:
  #   api_key: ${ZHIPU_API_KEY}
  # moonshot:
  #   api_key: ${MOONSHOT_API_KEY}
  # minimax:
  #   api_key: ${MINIMAX_API_KEY}
  #   base_url: "https://api.minimax.io/anthropic"  # International version
  # mistral:
  #   api_key: ${MISTRAL_API_KEY}
  # xai:
  #   api_key: ${XAI_API_KEY}

# Server settings
server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "*"

# Tips:
#   - Use ${ENV_VAR} to reference environment variables (recommended for production)
#   - Plain text keys are convenient for development only
#   - base_url allows you to use local/private LLM deployments (Ollama, vLLM, etc.)
#   - Server will show available providers in Playground
