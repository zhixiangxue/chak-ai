                // Per-turn elapsed wall-clock. Only rendered when we have
                // at least two timestamped messages inside the turn — a
                // single-message turn (e.g. a lone system prompt in the
                // "setup" group) has no meaningful span. The
                // "setup" pseudo-turn also opts out because its
                // messages are usually just seeding data, not a
                // real interactive round.
                const dur = isTurn ? fmtDuration(computeSpanMs(g.messages)) : '';
                const durHtml = dur
                    ? `<span class="turn-duration" title="Elapsed from first to last message in this turn"><span class="lbl">elapsed</span>${escapeHtml(dur)}</span>`
                    : '';
                let header;
                if (isTurn) {
                    turnNum += 1;
                    const nn = String(turnNum).padStart(2, '0');
                    // ``id="turn-N"`` is the anchor target for the
                    // right-side turn quick-nav rail (``.turn-rail``).
                    // N is the 1-based visible turn number, matching
                    // the ``turn-num`` label so the chip "03" jumps to
                    // the header that also reads "03".
                    header = `<div class="turn-header" id="turn-${turnNum}">
                         <span class="turn-num">${nn}</span>
                         <span class="turn-label">turn</span>
                         <span class="turn-id">${escapeHtml(shortId(g.turn_id))}</span>
                         <span class="turn-count">${g.messages.length} msg${g.messages.length === 1 ? '' : 's'}</span>
                         ${durHtml}
                       </div>`;
                } else {
                    header = `<div class="turn-header">
                         <span class="turn-num">setup</span>
                         <span class="turn-count">${g.messages.length} msg${g.messages.length === 1 ? '' : 's'}</span>
                       </div>`;
                }
                const body = g.messages.map(renderMessage).join('');
                return `<div class="turn ${isTurn ? '' : 'ungrouped'}">${header}${body}</div>`;
            }).join('');
        }

        /* Aggregate token usage across all assistant messages, bucketed by
         * `provider/model` (a full model_uri). Cost is model-specific, so
         * summing per-model — not per-provider — is what actually matches a
         * billing line item. Failover/router runs show each model on its own
         * row instead of collapsing under one provider bucket.
         *
         * chak normalizes all provider usage into four disjoint buckets
         * (see chak/metadata.py Usage docstring):
         *   prompt_tokens                = fresh input tokens (billed at Input rate)
         *   completion_tokens            = output tokens
         *   cache_creation_input_tokens  = cache WRITE (Anthropic ~1.25× input)
         *   cache_read_input_tokens      = cache READ  (Anthropic ~0.1× input)
         * so total_tokens = pt + ct + cc + cr with no double-counting. We
         * surface cache_w / cache_r as separate columns because their unit
         * prices differ by an order of magnitude — collapsing them hides
         * where the money actually goes. */
        function aggregateStats(messages) {
            const byUri = new Map();
            for (const m of messages) {
                if (m.role !== 'assistant') continue;
                const md_ = m.metadata || {};
                const usage = md_.usage;
                if (!usage) continue;
                const key = modelUri(md_) || 'unknown';
                const b = byUri.get(key) || {
                    uri: key, calls: 0,
                    prompt: 0, completion: 0,
                    cache_w: 0, cache_r: 0,
                    total: 0,
                };
                const pt = usage.prompt_tokens || 0;
                const ct = usage.completion_tokens || 0;
                const cc = usage.cache_creation_input_tokens || 0;
                const cr = usage.cache_read_input_tokens || 0;
                b.calls      += 1;
                b.prompt     += pt;
                b.completion += ct;
                b.cache_w    += cc;
                b.cache_r    += cr;
                // Fallback matches chak's canonical invariant
                // (total == pt + ct + cc + cr) for defensive handling of
                // stale dumps produced before the disjoint-normalization fix.
                b.total      += usage.total_tokens || (pt + ct + cc + cr);
                byUri.set(key, b);
            }
            return [...byUri.values()].sort((a, b) => b.total - a.total);
        }

        function renderStats(messages) {
            const buckets = aggregateStats(messages);
            if (!buckets.length) {
                statsEl.innerHTML = '<div class="stats-empty">no llm calls yet</div>';
                return;
            }
            const nz = (n) => n > 0
                ? `<span>${fmtNum(n)}</span>`
                : `<span class="zero">0</span>`;
            const rows = buckets.map(b => `
                <tr>
                    <td><span class="model-uri">${escapeHtml(b.uri)}</span></td>
                    <td class="num dim">${fmtNum(b.calls)}</td>
                    <td class="num">${nz(b.prompt)}</td>
                    <td class="num">${nz(b.completion)}</td>
                    <td class="num">${nz(b.cache_w)}</td>
                    <td class="num">${nz(b.cache_r)}</td>
                    <td class="num">${nz(b.total)}</td>
                </tr>`).join('');
            // Grand-total row — useful when multiple model_uris are in play.
            const totals = buckets.reduce((a, b) => ({
                calls: a.calls + b.calls,
                prompt: a.prompt + b.prompt,
                completion: a.completion + b.completion,
                cache_w: a.cache_w + b.cache_w,
                cache_r: a.cache_r + b.cache_r,
                total: a.total + b.total,
            }), { calls: 0, prompt: 0, completion: 0, cache_w: 0, cache_r: 0, total: 0 });
            const totalRow = buckets.length > 1 ? `
                <tr class="total">
                    <td>total</td>
                    <td class="num">${fmtNum(totals.calls)}</td>
                    <td class="num">${fmtNum(totals.prompt)}</td>
                    <td class="num">${fmtNum(totals.completion)}</td>
                    <td class="num">${fmtNum(totals.cache_w)}</td>
                    <td class="num">${fmtNum(totals.cache_r)}</td>
                    <td class="num">${fmtNum(totals.total)}</td>
                </tr>` : '';
            statsEl.innerHTML = `<table class="stats">
                <thead>
                    <tr>
                        <th>model_uri</th>
                        <th class="num">calls</th>
                        <th class="num" title="prompt_tokens — fresh input (billed at Input rate)">in</th>
                        <th class="num" title="completion_tokens — output (billed at Output rate)">out</th>
                        <th class="num" title="cache_creation_input_tokens — cache WRITE (Anthropic ~1.25× input)">cache_w</th>
                        <th class="num" title="cache_read_input_tokens — cache READ (Anthropic ~0.1× input)">cache_r</th>
                        <th class="num" title="in + out + cache_w + cache_r (four disjoint buckets)">total</th>
                    </tr>
                </thead>
                <tbody>${rows}${totalRow}</tbody>
            </table>`;
        }

        // Index of tool_call_id → { name, arguments } built from all
        // assistant tool-call-request messages, so tool response cards
        // can echo the original request inline.
        let _toolCallIndex = new Map();

        function buildToolCallIndex(messages) {
            _toolCallIndex = new Map();
            for (const m of messages) {
                if (m.role === 'assistant' && Array.isArray(m.tool_calls)) {
                    for (const tc of m.tool_calls) {
                        if (tc.id) {
                            _toolCallIndex.set(tc.id, {
                                name: (tc.function && tc.function.name) || '?',
                                arguments: (tc.function && tc.function.arguments) || '',
                            });
                        }
                    }
                }
            }
        }

        let lastCount = 0;

        // ─── Client-side message cache (localStorage-backed) ────────
        // Keeps the full messages array per conv so the UI survives
        // server disconnection AND page refresh. Export falls back to
        // this when the /dump endpoint is unreachable.
        //
        // Storage keys
        const _STORAGE_KEY = 'chak_inspector_cache';
        const _SERVER_ID_KEY = 'chak_inspector_server_id';
        // Format: { _ts: epoch_ms, convs: { [conv_id]: messages[] } }
        // _ts is updated on every persist so we can evict stale data.
        const _CACHE_TTL_MS = 24 * 60 * 60 * 1000;  // 24 hours

        const _msgCache = new Map();  // conv_id → messages[]

        // Hydrate from localStorage on boot, discarding expired data.
        (function _hydrateCache() {
            try {
                const raw = localStorage.getItem(_STORAGE_KEY);
                if (!raw) return;
                const obj = JSON.parse(raw);
                // TTL check: if the cache is older than threshold, discard.
                const ts = obj._ts || 0;
                if (Date.now() - ts > _CACHE_TTL_MS) {
                    localStorage.removeItem(_STORAGE_KEY);
                    return;
                }
                const convs = obj.convs || obj;  // backward compat
                for (const [cid, msgs] of Object.entries(convs)) {
                    if (cid.startsWith('_')) continue;  // skip meta keys
                    if (Array.isArray(msgs) && msgs.length) {
                        _msgCache.set(cid, msgs);
                    }
                }
            } catch (e) {
                console.warn('[chak] failed to hydrate cache from localStorage:', e);
            }
        })();

        // Clear stale cache when a new server process is detected.
        // Called from the SSE handler when server_id arrives.
        function _invalidateCacheIfNewServer(serverId) {
            const prev = localStorage.getItem(_SERVER_ID_KEY);
            if (prev && prev !== serverId) {
                // New server session — old conv data is irrelevant.
                _msgCache.clear();
                localStorage.removeItem(_STORAGE_KEY);
            }
            localStorage.setItem(_SERVER_ID_KEY, serverId);
        }

        // Persist cache to localStorage. Called on every cache update.
        // Debounced to avoid thrashing on rapid SSE ticks.
        let _persistTimer = null;
        function _persistCache() {
            if (_persistTimer) return;
            _persistTimer = setTimeout(() => {
                _persistTimer = null;
                try {
                    const obj = { _ts: Date.now(), convs: {} };
                    for (const [cid, msgs] of _msgCache) {
                        obj.convs[cid] = msgs;
                    }
                    localStorage.setItem(_STORAGE_KEY, JSON.stringify(obj));
                } catch (e) {
                    // Likely QuotaExceededError — log but don't crash.
                    console.warn('[chak] localStorage persist failed:', e);
                }
            }, 500);
        }

        function render(messages) {
            // Persist into client-side cache so data survives disconnect
            // AND page refresh (backed by localStorage).
            if (currentConvId && messages && messages.length) {
                _msgCache.set(currentConvId, messages);
                _persistCache();
            }
            // Reset the raw-text stash before rebuilding cards so id
            // slots stay bounded to a single render and stale payloads
            // don't accumulate across live-updating conversations.
            _rawCounter = 0;
            _rawMap.clear();
            buildToolCallIndex(messages);
            renderStats(messages);
            if (!messages.length) {
                root.innerHTML = '<div class="empty-state">waiting for messages…</div>';
                // Still refresh the conv-info strip so its msgs chip
                // reads "0" instead of a stale count from a previously
                // selected conv.
                renderConvInfo();
                // Empty conv → no turns → clear any leftover nav chips
                // from the previously selected conv.
                renderTurnRail([]);
                return;
            }
            // Deliberately no auto-scroll on new messages — users found it
            // disruptive when reading upthread while the agent kept
            // producing tool calls. Reading position stays put; the msg
            // counter in the header signals new activity.
            const groups = groupByTurn(messages);
            root.innerHTML = renderGroups(groups);
            lastCount = messages.length;
            // The conv-info strip carries the total elapsed wall-clock
            // and the msg count chip, both derived from message
            // timestamps / length — refresh it on every render so the
            // chips stay in sync as new messages stream in. Cheap: it
            // only reads `_msgCache` + `_lastRosterConvs`.
            renderConvInfo();
            // Turn quick-nav rail: one chip per numbered turn, in the
            // same order the ``renderGroups`` walker assigned them.
            // Setup / ungrouped groups are skipped so chip labels
            // match the ``turn-num`` labels 1:1.
            const railItems = [];
            let railN = 0;
            for (const g of groups) {
                if (!g.turn_id) continue;
                railN += 1;
                railItems.push({
                    n: railN,
                    msgs: g.messages.length,
                    dur: fmtDuration(computeSpanMs(g.messages)),
                });
            }
            renderTurnRail(railItems);
        }

        /* ─── Multi-conversation client ────────────────────────────
         * The server hosts N convs and exposes one SSE stream per conv at
         * /stream/{conv_id}. This client keeps track of the currently
         * selected conv, opens exactly one EventSource for it, and swaps
         * the connection when the user clicks a tab.
         *
         * The server also stamps every SSE payload with `server_id` (per-
         * process fingerprint) and `roster_version` (bumped whenever a
         * new conv is attached). We use these to:
         *   1. force a full reload when the backing process restarts, so
         *      the browser never renders against stale HTML/CSS;
         *   2. refresh the tab bar in-place when a sibling conv appears
         *      after the page was loaded — no manual refresh needed.
         */
        const tabsEl = document.getElementById('convTabs');
        // Export button is now rendered inside ``.conv-info-bar`` by
        // ``renderConvInfo`` and rebuilt on every message tick, so we
        // can't hold a stable reference here — use delegation on the
        // stable ``convInfoEl`` instead (see the click listener below).
        const convInfoEl = document.getElementById('convInfo');

        let currentConvId = null;
        let currentEs = null;
        let lastRosterVersion = -1;
        // Last-known roster from the server, cached here so ``switchConv``
        // and the conv-info renderer don't need to refetch ``/convs`` on
        // every tab click. Always mirrors what ``renderTabs`` was last
        // called with.
        let _lastRosterConvs = [];

        function shortId(cid) {
            return typeof cid === 'string' ? cid.slice(0, 8) : String(cid);
        }

        /* Render the current-conv identity strip in the main-column
         * header. Reads from the cached roster (populated by
         * ``renderTabs``) so it works whether triggered by a live SSE
         * roster update or a plain tab click.
         *
         * Also owns the per-conv controls that used to live in the
         * removed ``.top-bar`` — the msg count chip and the JSON export
         * button. Because ``convInfoEl.innerHTML`` is rebuilt in full on
         * every render, any listeners must be attached via event
         * delegation on ``convInfoEl`` (stable) rather than on the
         * rebuilt children (throw-away). See the export handler below. */
        function renderConvInfo() {
            if (!convInfoEl) return;
            const c = _lastRosterConvs.find(x => x.id === currentConvId);
            if (!c) {
                convInfoEl.innerHTML = '';
                return;
            }
            const rawTitle = (typeof c.title === 'string' && c.title.trim())
                ? c.title.trim()
                : null;
            const titleCls = rawTitle ? 'ci-title' : 'ci-title untitled';
            const titleText = escapeHtml(rawTitle || 'Untitled');
            const idText = escapeHtml(c.id || '');
            const modelText = c.model_uri ? escapeHtml(c.model_uri) : '—';
            // Elapsed wall-clock across every message we've cached for
            // this conv — from the first message's timestamp up to the
            // latest. We read from `_msgCache` (rather than the roster)
            // because timestamps live on message objects; the roster only
            // exposes conv-level identity metadata. Renders as "" when
            // there aren't yet two timestamped messages to span between.
            const cachedMsgs = _msgCache.get(c.id);
            const dur = fmtDuration(computeSpanMs(cachedMsgs));
            const durHtml = dur
                ? `<div class="ci-duration" title="Elapsed from first to latest message in this conversation"><span class="lbl">elapsed</span>${escapeHtml(dur)}</div>`
                : '';
            // Msg count comes straight from the cached message list; the
            // roster's ``msg_count`` field lags one SSE frame behind for
            // an actively-streaming conv, and using the cache lets the
            // chip tick up in perfect sync with the message stream
            // below. Renders even when the count is 0 so users always
            // have a definite "nothing yet" signal.
            const nMsgs = Array.isArray(cachedMsgs) ? cachedMsgs.length : 0;
            // Turn count — number of distinct ``turn_id`` values in the
            // cached messages. Setup / ungrouped messages (turn_id ==
            // null) are excluded so this matches the numbered ``turn``
            // groups the user actually sees below. Rendered only when
            // at least one real turn exists; a pure-setup conv would
            // read as "0 turns" otherwise, which is noise.
            let nTurns = 0;
            if (Array.isArray(cachedMsgs) && cachedMsgs.length) {
                const seen = new Set();
                for (const m of cachedMsgs) {
                    if (m && m.turn_id) seen.add(m.turn_id);
                }
                nTurns = seen.size;
            }
            const turnsHtml = nTurns > 0
                ? `<div class="ci-turns" title="Number of turns in this conversation"><span class="lbl">turns</span>${fmtNum(nTurns)}</div>`
                : '';
            const countHtml =
                `<div class="ci-count" title="Message count in this conversation">` +
                    `<span class="lbl">msgs</span>${fmtNum(nMsgs)}` +
                `</div>`;
            const exportHtml =
                `<button class="btn ci-export" type="button" title="Download conversation as JSON">export</button>`;
            convInfoEl.innerHTML =
                `<div class="ci-title-row">` +
                    `<div class="${titleCls}">${titleText}</div>` +
                    turnsHtml +
                    countHtml +
                    durHtml +
                    exportHtml +
                `</div>` +
                `<div class="ci-meta">` +
                    `<span class="ci-id">${idText}</span>` +
                    `<span class="sep">·</span>` +
                    `<span class="ci-model">${modelText}</span>` +
                `</div>`;
        }

        /* The full conv id is written into the DOM verbatim and clipped
         * visually via ``text-overflow: ellipsis`` on ``.cid`` — that
         * way a drag-select yields the complete id, not the truncated
         * ``6ad25e5a-4e0…`` prefix. Widening the sidebar (drag the
         * divider) also reveals more of it without any DOM change. */
        function renderTabs(convs) {
            // Cache the roster so ``renderConvInfo`` and ``switchConv``
            // can look up per-conv metadata without another fetch. Always
            // keep a defensive copy — callers may mutate the array we
            // received.
            _lastRosterConvs = Array.isArray(convs) ? convs.slice() : [];
            // Always show the switcher, even for a single conv — the
            // sidebar's whole reason for existing is to give the user a
            // consistent "where am I" anchor. Hiding it on 1-conv sessions
            // just makes the layout jump when a second conv attaches.
            tabsEl.classList.remove('hidden');
            if (!convs || !convs.length) {
                tabsEl.innerHTML = '';
                renderConvInfo();
                return;
            }
            tabsEl.innerHTML = convs.map(c => {
                const active = c.id === currentConvId ? ' active' : '';
                const uri = c.model_uri ? escapeHtml(c.model_uri) : '\u2014';
                // Title falls back to "Untitled" when ``conv.title`` was
                // never set. Italic-muted styling on ``.title.untitled``
                // signals "placeholder, not real title" without needing
                // additional copy.
                const rawTitle = (typeof c.title === 'string' && c.title.trim())
                    ? c.title.trim()
                    : null;
                const titleCls = rawTitle ? 'title' : 'title untitled';
                const titleText = escapeHtml(rawTitle || 'Untitled');
                // ``msg_count`` used to render here as a bare ``[N]`` badge,
                // but the meaning wasn't obvious at a glance. Dropped in
                // favor of a title tooltip so the tab stays uncluttered;
                // the selected conv's message count is already shown
                // prominently in the top-right ``count`` element.
                const runStr = c.running ? ' · running' : '';
                const tipPrefix = rawTitle ? `${rawTitle} — ` : '';
                const tip = `${tipPrefix}${c.id} · ${c.msg_count} msg${c.msg_count === 1 ? '' : 's'}${runStr}`;
                const spinner = c.running ? '<span class="spinner" aria-label="running"></span>' : '';
                return `
                    <button class="conv-tab${active}" data-cid="${escapeHtml(c.id)}" title="${escapeHtml(tip)}">
                        <span class="${titleCls}">
                            <span class="title-text">${titleText}</span>
                            ${spinner}
                        </span>
                        <span class="cid">${escapeHtml(c.id)}</span>
                        <span class="uri">${uri}</span>
                    </button>`;
            }).join('');
            tabsEl.querySelectorAll('.conv-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cid = btn.getAttribute('data-cid');
                    if (cid && cid !== currentConvId) switchConv(cid);
                });
            });
            // Roster may have changed the title / model of the active
            // conv (e.g. user set ``conv.title`` mid-session), so refresh
            // the identity strip on every render.
            renderConvInfo();
        }

        async function refreshRoster() {
            try {
                const resp = await fetch('/convs');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                lastRosterVersion = data.roster_version;
                // First-time boot: pick the first conv.
                if (!currentConvId && data.convs && data.convs.length) {
                    currentConvId = data.convs[0].id;
                }
                renderTabs(data.convs || []);
                return data;
            } catch (e) {
                console.error('refreshRoster failed:', e);
                return null;
            }
        }

        function switchConv(cid) {
            currentConvId = cid;
            // Reset per-conv view state so the new conv doesn't inherit
            // scroll/count artifacts from the previous one.
            lastCount = 0;
            // Re-render tabs so the active indicator moves.
            // (Cheaper than a full /convs refetch; roster hasn't changed.)
            tabsEl.querySelectorAll('.conv-tab').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-cid') === cid);
            });
            // Refresh the identity strip so the header reflects the newly
            // selected conv immediately, without waiting for the next
            // roster update to arrive.
            renderConvInfo();

            // If offline, restore from client-side cache instead of
            // trying to reconnect to a dead server.
            if (_offline) {
                const cached = _msgCache.get(cid);
                if (cached && cached.length) {
                    render(cached);
                } else {
                    root.innerHTML = '<div class="empty-state">no cached data for this conversation</div>';
                    statsEl.innerHTML = '<div class="stats-empty">no llm calls yet</div>';
                }
                return;
            }

            root.innerHTML = '<div class="empty-state">loading…</div>';
            statsEl.innerHTML = '<div class="stats-empty">no llm calls yet</div>';
            // Clear the tool contract panel so the previous conv's tools
            // don't linger while the new conv's SSE is still connecting.
            // The first frame on the new stream will repopulate it (or
            // hide it if the new conv has no tools).
            renderToolsPanel([]);
            if (currentEs) {
                currentEs.close();
                currentEs = null;
            }
            connect();
        }

        // ─── Reconnect logic with bounded retries ─────────────
        // After the server process exits, infinite retries just burn
        // CPU and spam the console. We allow a few attempts (enough to
        // ride out a momentary network hiccup) then stop gracefully,
        // keeping all rendered data intact so the user can still browse
        // and export.
        const MAX_RECONNECT_ATTEMPTS = 5;
        let _reconnectAttempts = 0;
        let _offline = false;  // true once we give up reconnecting

        // ─── Eager pre-fetch on disconnect ────────────────────────
        // On first connection error, immediately try to dump ALL convs
        // from the server before it fully dies. This fills _msgCache
        // for convs the user never visited, eliminating the
        // "no cached data" problem.
        let _eagerFetchDone = false;
        async function _eagerFetchAllConvs() {
            if (_eagerFetchDone) return;
            _eagerFetchDone = true;
            try {
                const resp = await fetch('/convs');
                if (!resp.ok) return;
                const data = await resp.json();
                const convs = data.convs || [];
                // Fetch each conv's messages in parallel.
                await Promise.allSettled(convs.map(async (c) => {
                    if (_msgCache.has(c.id) && _msgCache.get(c.id).length) return;
                    try {
                        const dr = await fetch('/dump/' + encodeURIComponent(c.id));
                        if (!dr.ok) return;
                        const dump = await dr.json();
                        const msgs = dump.messages || dump;
                        if (Array.isArray(msgs) && msgs.length) {
                            _msgCache.set(c.id, msgs);
                        }
                    } catch {}
                }));
                _persistCache();
            } catch (e) {
                // Server already dead — nothing we can do.
            }
        }

        // ─── Proactive background caching ─────────────────────────────
        // While the server is alive, periodically fetch messages for ALL
        // conversations we haven't cached yet. This ensures that by the
        // time the server dies, we already have everything in localStorage.
        let _bgCacheTimer = null;
        async function _backgroundCacheAll() {
            if (_offline) return;
            try {
                const resp = await fetch('/convs');
                if (!resp.ok) return;
                const data = await resp.json();
                const convs = data.convs || [];
                let cached = false;
                await Promise.allSettled(convs.map(async (c) => {
                    // Skip if already cached with same or more messages.
                    const existing = _msgCache.get(c.id);
                    if (existing && existing.length >= c.msg_count) return;
                    try {
                        const dr = await fetch('/dump/' + encodeURIComponent(c.id));
                        if (!dr.ok) return;
                        const dump = await dr.json();
                        const msgs = dump.messages || dump;
                        if (Array.isArray(msgs) && msgs.length) {
                            _msgCache.set(c.id, msgs);
                            cached = true;
                        }
                    } catch {}
                }));
                if (cached) _persistCache();
            } catch {}
        }

        function _startBackgroundCache() {
            // Run once immediately after first successful connect,
            // then every 10 seconds to pick up new messages.
            if (_bgCacheTimer) return;
            _backgroundCacheAll();
            _bgCacheTimer = setInterval(_backgroundCacheAll, 10000);
        }

        function _stopBackgroundCache() {
            if (_bgCacheTimer) {
                clearInterval(_bgCacheTimer);
                _bgCacheTimer = null;
            }
        }

        // ─── beforeunload guard ───────────────────────────────────
        // When offline, ALWAYS warn before refresh/close. Even though
        // localStorage should have the data, the user deserves a
        // conscious choice — accidental refresh loses live DOM state
        // and any cache that failed to persist.
        window.addEventListener('beforeunload', (e) => {
            if (!_offline) return;
            e.preventDefault();
            e.returnValue = '';
        });

        function connect() {
            if (!currentConvId) return;
            if (_offline) return;  // already gave up
            statusEl.textContent = 'connecting';
            dotEl.classList.remove('live');
            const cid = currentConvId;
            const es = new EventSource('/stream/' + encodeURIComponent(cid));
            currentEs = es;
            es.onopen = () => {
                _reconnectAttempts = 0;  // reset on successful connection
                statusEl.textContent = 'live';
                dotEl.classList.add('live');
                // Start background caching of all convs while server is alive.
                _startBackgroundCache();
            };
            es.onmessage = (evt) => {
                try {
                    const data = JSON.parse(evt.data);
                    // Stale-process guard: if server_id changed since first
                    // seen, the underlying uvicorn was restarted (possibly
                    // with a new viewer.html). Reload to avoid mixing
                    // client-side state with a fresh backend.
                    if (data.server_id) {
                        if (window.__server_id && window.__server_id !== data.server_id) {
                            location.reload();
                            return;
                        }
                        window.__server_id = data.server_id;
                        // Invalidate stale localStorage if server restarted.
                        _invalidateCacheIfNewServer(data.server_id);
                    }
                    // Server told us a sibling conv was attached — refresh
                    // the tab bar so the user can see it without reloading.
                    if (typeof data.roster_version === 'number'
                            && data.roster_version !== lastRosterVersion) {
                        refreshRoster();
                    }
                    // Every SSE tick that carries a change now piggybacks the
                    // full roster snapshot (msg_count + running per conv), so
                    // we can update sidebar spinners in-place without another
                    // ``/convs`` round-trip. Fall back to no-op if the payload
                    // is older-shape (older server behind an in-place restart).
                    if (Array.isArray(data.roster)) {
                        renderTabs(data.roster);
                    }
                    // Only ignore this stream if it's for a conv we've since
                    // switched away from — es may still fire once before close().
                    if (currentEs !== es) return;
                    // messages: null means "no change, keep last render".
                    if (data.messages) render(data.messages);
                    // tools: null means "no change" (server elides it to
                    // save bytes on ticks that only carry roster/msg
                    // updates). A concrete array — even an empty one —
                    // is authoritative and reflects the current wire
                    // contract chak has with the model.
                    if (data.tools !== undefined && data.tools !== null) {
                        renderToolsPanel(data.tools);
                    }
                } catch (e) { console.error(e); }
            };
            es.onerror = () => {
                es.close();
                if (currentEs === es) currentEs = null;
                dotEl.classList.remove('live');
                _reconnectAttempts++;
                // On first failure, eagerly fetch all convs while server
                // might still be reachable (race the shutdown).
                if (_reconnectAttempts === 1) {
                    _eagerFetchAllConvs();
                }
                if (_reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                    // Server is gone — enter offline mode but keep all data.
                    _offline = true;
                    _stopBackgroundCache();
                    statusEl.textContent = 'offline (data preserved)';
                    dotEl.classList.remove('live');
                    dotEl.classList.add('offline');
                    // Kill all spinners — nothing is running if server is dead.
                    tabsEl.querySelectorAll('.spinner').forEach(el => el.remove());
                    // Surface offline state prominently — the sidebar dot
                    // alone is too easy to miss when the user is focused
                    // on the message stream.
                    showOfflineBanner();
                } else {
                    statusEl.textContent = `reconnecting (${_reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`;
                    setTimeout(connect, 1500);
                }
            };
        }

        /* Export the *currently selected* conversation as JSON.
         *
         * Strategy: try the server's /dump endpoint first (it may include
         * richer data via conv.dump()). If the server is unreachable
         * (process exited), fall back to the client-side message cache so
         * the user can ALWAYS export — even after the process is long gone.
         *
         * Delegation on ``convInfoEl``: the button element itself is
         * rebuilt on every ``renderConvInfo`` call, so binding directly
         * to it would leave a stale listener attached to a detached
         * node. Delegation on the stable ancestor sidesteps that.
         */
        convInfoEl.addEventListener('click', async (ev) => {
            const btn = ev.target && ev.target.closest && ev.target.closest('.ci-export');
            if (!btn) return;
            if (!currentConvId) return;
            btn.disabled = true;
            const orig = btn.textContent;
            btn.textContent = '…';
            try {
                // Attempt server-side export first.
                const resp = await fetch('/dump/' + encodeURIComponent(currentConvId));
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const blob = await resp.blob();
                let filename = 'conversation.json';
                const cd = resp.headers.get('Content-Disposition') || '';
                const m = cd.match(/filename="([^"]+)"/);
                if (m) filename = m[1];
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
            } catch (e) {
                // Server unreachable — fall back to client-side cache.
                const cached = _msgCache.get(currentConvId);
                if (cached && cached.length) {
                    const payload = {
                        conversation_id: currentConvId,
                        messages: cached,
                        _exported_from: 'client_cache',
                        _exported_at: new Date().toISOString(),
                    };
                    const json = JSON.stringify(payload, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const filename = currentConvId.slice(0, 8) + '_offline.json';
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); a.remove();
                    URL.revokeObjectURL(url);
                } else {
                    alert('Export failed: server unreachable and no cached data available.');
                }
            } finally {
                // ``btn`` may already have been detached and replaced by
                // a fresh render during the async fetch above. Re-query
                // via the (stable) delegated ancestor to reach whichever
                // button is currently live — the old reference would
                // silently mutate a stale, unmounted node.
                const live = convInfoEl.querySelector('.ci-export') || btn;
                live.textContent = orig;
                live.disabled = false;
            }
        });

        /* ─── Floating scroll buttons logic ───────────────────────
           Show/hide based on scroll position: the "top" button appears
           when scrolled away from the very top; the "bottom" button
           appears when not at the very bottom. On a short page neither
           shows, keeping the UI uncluttered. */
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const scrollBottomBtn = document.getElementById('scrollBottomBtn');

        function updateScrollBtns() {
            const y = window.scrollY;
            const max = document.documentElement.scrollHeight - window.innerHeight;
            // Show top button when scrolled more than a viewport-quarter down
            scrollTopBtn.classList.toggle('visible', y > window.innerHeight * 0.25);
            // Show bottom button when there's meaningful content below
            scrollBottomBtn.classList.toggle('visible', max - y > window.innerHeight * 0.25);
        }

        function smoothScrollTo(target) {
            window.scrollTo({ top: target, behavior: 'smooth' });
        }

        scrollTopBtn.addEventListener('click', () => smoothScrollTo(0));
        scrollBottomBtn.addEventListener('click', () =>
            smoothScrollTo(document.documentElement.scrollHeight));
        window.addEventListener('scroll', updateScrollBtns, { passive: true });

        /* ─── Turn quick-nav rail ────────────────────────────────────
           Renders one clickable chip per numbered turn between the two
           scroll buttons on the right rail. Hidden entirely when the
           conv has fewer than two turns — a lone chip would just be
           visual noise duplicating the sole ``turn-header`` on screen.
           Chip labels are 2-digit padded (``01``, ``02``, …) so a run
           of up to 99 turns keeps a stable column width; three digits
           overflow naturally since the chip is width-bounded by CSS. */
        const turnRailEl = document.getElementById('turnRail');

        function renderTurnRail(items) {
            if (!turnRailEl) return;
            // < 2 turns: skip the rail entirely (the ``:empty`` CSS rule
            // hides the container). Setup-only convs and single-turn
            // convs both fall through here.
            if (!Array.isArray(items) || items.length < 2) {
                turnRailEl.innerHTML = '';
                return;
            }
            turnRailEl.innerHTML = items.map(it => {
                const nn = String(it.n).padStart(2, '0');
                // Tooltip mirrors the per-turn metrics shown in the
                // ``turn-header`` so hovering a chip previews "what's
                // in there" before committing to the jump.
                const parts = [`turn ${nn}`,
                               `${it.msgs} msg${it.msgs === 1 ? '' : 's'}`];
                if (it.dur) parts.push(it.dur);
                const tip = escapeHtml(parts.join(' · '));
                return `<button class="turn-chip" type="button" data-turn="${it.n}" title="${tip}" aria-label="Jump to ${tip}">${nn}</button>`;
            }).join('');
        }

        // Delegated click handler so re-renders (which wipe the chip DOM)
        // don't need to re-attach listeners.
        turnRailEl.addEventListener('click', (ev) => {
            const chip = ev.target && ev.target.closest && ev.target.closest('.turn-chip');
            if (!chip) return;
            const n = chip.getAttribute('data-turn');
            if (!n) return;
            const target = document.getElementById('turn-' + n);
            if (!target) return;
            // ``scrollIntoView`` puts the anchor flush with the viewport
            // top; that would sit directly under the (non-sticky) header
            // strip, which is fine here but we still request a smooth
            // scroll for legibility rather than a jarring jump.
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        /* ─── Copy-button click delegation ──────────────────────
           Single delegated listener rather than per-button binding so
           re-renders (which blow away the DOM) don't need to re-attach
           handlers. Uses the async Clipboard API where available; falls
           back to a hidden textarea + execCommand for older WebViews and
           for pages loaded from ``file://`` where Clipboard API is
           blocked. Visual confirmation swaps the label to "copied" for
           ~1.2s, matching devtool conventions. */
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;
            const id = btn.getAttribute('data-raw-id');
            const text = _rawMap.get(id);
            if (text == null) return;
            const flash = (ok) => {
                const orig = btn.textContent;
                btn.classList.add('copied');
                btn.textContent = ok ? 'copied' : 'failed';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = orig;
                }, 1200);
            };
            const legacyCopy = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                // Off-screen but still selectable; avoids scrolling.
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch { ok = false; }
                ta.remove();
                flash(ok);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => flash(true))
                    .catch(() => legacyCopy());
            } else {
                legacyCopy();
            }
        });

        // Re-evaluate after content renders (new messages may grow the page)
        const _origRender = render;
        render = function(messages) {
            _origRender(messages);
            // Defer until the DOM reflects the new innerHTML
            requestAnimationFrame(updateScrollBtns);
        };
        updateScrollBtns();

        /* ─── Sidebar resize ────────────────────────────────────
           Drag the divider between the sidebar and the main column to
           adjust how much horizontal room the conv list gets. State is
           deliberately not persisted — a page refresh resets to the
           default, matching "transient tool" expectations.

           Pointer Events are used (not separate mouse/touch) so trackpad
           + touchscreen laptops work out of the box. */
        const SIDEBAR_MIN = 160;
        const SIDEBAR_DEFAULT = 232;
        const resizerEl = document.getElementById('sidebarResizer');

        function _clampSidebarWidth(px) {
            // Cap at 60% of viewport so a wide drag on a narrow window
            // can never push the divider off-screen. Lower bound keeps
            // the tab labels legible.
            const vpCap = Math.max(SIDEBAR_MIN, Math.floor(window.innerWidth * 0.6));
            return Math.min(Math.max(SIDEBAR_MIN, px | 0), vpCap);
        }

        function _applySidebarWidth(px) {
            document.documentElement.style.setProperty(
                '--sidebar-w', _clampSidebarWidth(px) + 'px');
        }

        let _dragStartX = 0;
        let _dragStartW = 0;
        let _dragging = false;

        // We attach ``pointermove`` / ``pointerup`` to ``window`` instead
        // of the resizer element. That way even if the pointer leaves the
        // 8px strip — which happens the instant a drag actually moves
        // the sidebar boundary — we keep receiving events. This is more
        // robust than ``setPointerCapture``, which has known quirks in
        // some WebKit / Chromium versions where captured pointermove
        // simply doesn't fire.
        resizerEl.addEventListener('pointerdown', (e) => {
            // Ignore non-primary mouse buttons; a right-click that starts
            // a drag would have no matching pointerup.
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            e.preventDefault();
            _dragStartX = e.clientX;
            const cssW = getComputedStyle(document.documentElement)
                .getPropertyValue('--sidebar-w').trim();
            _dragStartW = parseInt(cssW, 10) || SIDEBAR_DEFAULT;
            _dragging = true;
            resizerEl.classList.add('dragging');
            document.body.classList.add('resizing');
        });

        window.addEventListener('pointermove', (e) => {
            if (!_dragging) return;
            _applySidebarWidth(_dragStartW + (e.clientX - _dragStartX));
        });

        function _endResizeDrag() {
            if (!_dragging) return;
            _dragging = false;
            resizerEl.classList.remove('dragging');
            document.body.classList.remove('resizing');
        }
        // ``pointerup`` catches the normal release; ``pointercancel`` fires
        // if the OS interrupts (e.g. touch cancelled by a system gesture);
        // ``blur`` handles alt-tab mid-drag so we don't get stuck in the
        // resizing state after focus comes back.
        window.addEventListener('pointerup', _endResizeDrag);
        window.addEventListener('pointercancel', _endResizeDrag);
        window.addEventListener('blur', _endResizeDrag);

        // Boot: fetch the conv roster first (which picks the initial
        // currentConvId), then open the SSE stream for it.
        // If server is already dead on boot, fall back to localStorage.
        (async () => {
            const data = await refreshRoster();
            if (!currentConvId) {
                // Server unreachable but we have cached data — enter
                // offline mode and render from localStorage.
                if (_msgCache.size > 0 && !data) {
                    _offline = true;
                    statusEl.textContent = 'offline (restored from cache)';
                    dotEl.classList.add('offline');
                    showOfflineBanner();
                    // Reconstruct tab bar from cached conv IDs.
                    const cachedConvs = [..._msgCache.keys()].map(cid => ({
                        id: cid,
                        model_uri: null,
                        msg_count: _msgCache.get(cid).length,
                        running: false,
                    }));
                    currentConvId = cachedConvs[0].id;
                    renderTabs(cachedConvs);
                    render(_msgCache.get(currentConvId));
                    return;
                }
                // No convs attached yet — poll roster until one shows up.
                statusEl.textContent = 'waiting';
                const iv = setInterval(async () => {
                    const d = await refreshRoster();
                    if (currentConvId) { clearInterval(iv); connect(); }
                }, 800);
                return;
            }
            connect();
        })();
    </script>
</body>
</html>
