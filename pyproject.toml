[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chakpy"
version = "0.4.1"
description = "A simple, yet elegant, LLM API routing library"
readme = "README.md"
authors = [
    { name = "zhixiang" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "openai", "api", "routing", "chatbot", "ai"]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "dashscope>=1.20.0",
    "httpx>=0.24.0",
    "boto3>=1.26.0",
    "tiktoken>=0.5.0",
    "loguru>=0.7.0",
    "docstring-parser>=0.15",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]
documents = [
    "PyMuPDF>=1.23.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]
web = [
    "beautifulsoup4>=4.12.0",        # HTML parsing (Web all layers)
    "readability-lxml>=0.8.1",       # HTML content extraction (Web Layer 3)
    "firecrawl-py>=1.0.0",           # Firecrawl API client (Web Layer 1, needs API key)
    "tavily-python>=0.3.0",          # Tavily AI search client (Search Layer 1, needs API key)
    "ddgs>=0.1.0",                   # DuckDuckGo backend (Search Layer 3, renamed from duckduckgo-search)
]
tools = [
    # Pdf tool
    "pymupdf4llm>=0.0.17",
    "pymupdf-layout>=1.27.0",
    "markdown>=3.4.0",
    # Web tool
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "firecrawl-py>=1.0.0",
    # Search tool
    "tavily-python>=0.3.0",
    "ddgs>=0.1.0",
    # Sandbox tool
    "e2b>=2.0.0",
    # Excel tool
    "openpyxl>=3.1.0",
    # SQL tool (PostgreSQL / MySQL — optional, SQLite is built-in)
    # "psycopg2-binary>=2.9.0",   # PostgreSQL
    # "pymysql>=1.1.0",           # MySQL
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "firecrawl-py>=1.0.0",
    "tavily-python>=0.3.0",
    "ddgs>=0.1.0",
    "pymupdf4llm>=0.0.17",
    "pymupdf-layout>=1.27.0",
    "markdown>=3.4.0",
    "e2b>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/zhixiangxue/chak-ai"
Repository = "https://github.com/zhixiangxue/chak-ai"
Documentation = "https://github.com/zhixiangxue/chak-ai/blob/main/README.md"
"Bug Tracker" = "https://github.com/zhixiangxue/chak-ai/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
chak = ["server/playground.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: offline tests without network or LLM calls",
    "live: real LLM provider tests",
    "slow: slow tests",
    "tools: tool calling tests",
    "streaming: streaming response tests",
    "structured: structured output tests",
    "skill: skill and ClaudeSkill tests",
    "deepseek: DeepSeek live provider tests",
    "qwen: Qwen/Bailian live provider tests",
    "openai: OpenAI live provider tests",
    "claude: Claude/Anthropic live provider tests",
]
asyncio_mode = "auto"
